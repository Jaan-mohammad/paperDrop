<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Notes — paperDrop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar glass-nav">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">📄 paperDrop</a>
      <div class="d-flex align-items-center gap-3">
        <a href="/browse.html" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">Browse</a>
        <a href="/dashboard.html" style="color:var(--text-secondary); font-size:0.85rem; text-decoration:none;">Dashboard</a>
        <button class="btn-glass-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <div class="mb-4">
          <h1 class="page-title">Upload Notes 📤</h1>
          <p class="page-subtitle">Share your study materials with everyone</p>
        </div>

        <div class="glass-card">

          <div class="glass-alert" id="message"></div>

          <!-- File Drop Zone -->
          <div id="dropZone" class="form-group" style="
            border: 2px dashed var(--glass-border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
          ">
            <p style="font-size:2rem; margin:0;">📁</p>
            <p style="color:var(--text-secondary); margin:0.5rem 0 0;">
              Click to select a PDF or DOC file
            </p>
            <p style="color:var(--text-muted); font-size:0.78rem; margin:0.25rem 0 0;">
              Max file size: 10MB
            </p>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx"
              style="display:none;">
          </div>

          <!-- Selected file name display -->
          <div id="fileName" style="
            font-size:0.82rem;
            color:var(--text-secondary);
            margin-top:0.5rem;
            display:none;
          "></div>

          <hr class="glass-divider">

          <div class="form-group">
            <label class="glass-label">Title</label>
            <input type="text" id="title" class="glass-input"
              placeholder="e.g. Operating Systems Notes Chapter 1-5">
          </div>

          <div class="row g-3">
            <div class="col-6">
              <div class="form-group">
                <label class="glass-label">Subject</label>
                <input type="text" id="subject" class="glass-input"
                  placeholder="e.g. OS, DBMS, CN">
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <label class="glass-label">Semester</label>
                <select id="semester" class="glass-input">
                  <option value="">Select</option>
                  <option value="1">Semester 1</option>
                  <option value="2">Semester 2</option>
                  <option value="3">Semester 3</option>
                  <option value="4">Semester 4</option>
                  <option value="5">Semester 5</option>
                  <option value="6">Semester 6</option>
                  <option value="7">Semester 7</option>
                  <option value="8">Semester 8</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="glass-label">Description <span style="color:var(--text-muted)">(optional)</span></label>
            <textarea id="description" class="glass-input"
              placeholder="Brief description of what this note covers..."
              rows="3" style="resize:vertical;"></textarea>
          </div>

          <button id="uploadBtn" class="btn-glass mt-2">
            Upload Note
          </button>

        </div>
      </div>
    </div>
  </div>

  <script src="/js/upload.js"></script>
</body>
</html>
