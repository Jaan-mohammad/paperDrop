<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — paperDrop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar glass-nav">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">📄 paperDrop</a>
      <div class="d-flex align-items-center gap-3">
        <a href="/browse.html"
          style="color:var(--text-secondary);
          font-size:0.85rem;
          text-decoration:none;">
          Browse
        </a>
        <a href="/upload.html"
          style="color:var(--text-secondary);
          font-size:0.85rem;
          text-decoration:none;">
          Upload
        </a>
        <a href="/admin.html"
          id="adminLink"
          style="color:var(--accent);
          font-size:0.85rem;
          text-decoration:none;
          display:none;">
          👑 Admin
        </a>
        <button class="btn-glass-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <!-- Welcome -->
    <div class="mb-5">
      <h1 class="page-title" id="welcomeTitle">Welcome back 👋</h1>
      <p class="page-subtitle" id="userEmail"></p>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-5">
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0"
            style="font-size:2rem; font-weight:700;"
            id="statUploads">
            —
          </p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            My Uploads
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0"
            style="font-size:2rem; font-weight:700;"
            id="statDownloads">
            —
          </p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Total Downloads
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0"
            style="font-size:2rem; font-weight:700;"
            id="statTotal">
            —
          </p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Notes on Platform
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center"
          style="cursor:pointer;"
          onclick="window.location.href='/upload.html'">
          <p class="mb-0" style="font-size:2rem;">📤</p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Upload New
          </p>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-3 mb-5">
      <div class="col-12 col-md-6">
        <div class="glass-card"
          style="cursor:pointer;"
          onclick="window.location.href='/browse.html'">
          <div class="d-flex align-items-center gap-3">
            <div style="font-size:1.8rem;">🔍</div>
            <div>
              <p style="font-weight:600; margin:0;">Browse Notes</p>
              <p style="font-size:0.8rem;
                color:var(--text-secondary); margin:0;">
                Find and download study materials
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="glass-card"
          style="cursor:pointer;"
          onclick="window.location.href='/upload.html'">
          <div class="d-flex align-items-center gap-3">
            <div style="font-size:1.8rem;">📤</div>
            <div>
              <p style="font-weight:600; margin:0;">Upload Notes</p>
              <p style="font-size:0.8rem;
                color:var(--text-secondary); margin:0;">
                Share your study materials
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- My Uploads -->
    <div>
      <h5 style="font-weight:600; margin-bottom:1rem;">My Uploads</h5>

      <div id="myUploadsList"></div>

      <div id="myUploadsEmpty"
        class="glass-card text-center py-5"
        style="display:none;">
        <p style="font-size:2rem;">📭</p>
        <p style="color:var(--text-secondary); margin:0;">
          You haven't uploaded anything yet.
        </p>
        <button
          class="btn-glass mt-3"
          style="width:auto; padding:0.6rem 1.5rem;"
          onclick="window.location.href='/upload.html'">
          Upload Now
        </button>
      </div>

      <div id="myUploadsLoading" class="text-center py-4">
        <div class="spinner-border"
          style="color:var(--accent);"
          role="status">
        </div>
      </div>

    </div>

  </div>

  <script>
    // Auth guard
    const token = localStorage.getItem('token')
    const user = JSON.parse(localStorage.getItem('user'))

    if (!token || !user) {
      window.location.href = '/login.html'
    }

    // Populate user info
    document.getElementById('welcomeTitle').textContent =
      `Welcome back, ${user.name} 👋`
    document.getElementById('userEmail').textContent = user.email

    // Show admin link if admin
    if (user.role === 'admin') {
      document.getElementById('adminLink').style.display = 'inline'
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token')
      localStorage.removeItem('user')
      window.location.href = '/login.html'
    })

    const authHeaders = {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    }

    // ─────────────────────────────────────
    // LOAD STATS
    // ─────────────────────────────────────
    async function loadStats() {
      try {
        const response = await fetch('/api/notes/my/stats', {
          headers: authHeaders
        })
        const data = await response.json()

        document.getElementById('statUploads').textContent =
          data.myUploads
        document.getElementById('statDownloads').textContent =
          data.myDownloads
        document.getElementById('statTotal').textContent =
          data.totalNotes

      } catch (error) {
        console.error('Stats error:', error)
      }
    }

    // ─────────────────────────────────────
    // LOAD MY UPLOADS
    // ─────────────────────────────────────
    async function loadMyUploads() {
      try {
        const response = await fetch('/api/notes/my/uploads', {
          headers: authHeaders
        })
        const data = await response.json()
        const notes = data.notes

        document.getElementById('myUploadsLoading').style.display = 'none'

        if (notes.length === 0) {
          document.getElementById('myUploadsEmpty').style.display = 'block'
          return
        }

        const statusColor = {
          approved: '#51cf66',
          pending: '#fcc419',
          rejected: '#ff6b6b'
        }

        document.getElementById('myUploadsList').innerHTML =
          notes.map(note => `
            <div class="glass-card mb-3">
              <div class="row align-items-center">
                <div class="col-12 col-md-8">
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <p style="font-weight:600; margin:0;">${note.title}</p>
                    <span style="font-size:0.72rem;
                      padding:0.2rem 0.6rem;
                      border-radius:20px;
                      background:${statusColor[note.status]}22;
                      color:${statusColor[note.status]};
                      border:1px solid ${statusColor[note.status]}44;">
                      ${note.status}
                    </span>
                  </div>
                  <p style="font-size:0.8rem;
                    color:var(--text-secondary); margin:0;">
                    ${note.subject} • Semester ${note.semester} •
                    📥 ${note.downloads} downloads
                  </p>
                </div>
                <div class="col-12 col-md-4 mt-2 mt-md-0">
                  <div class="d-flex justify-content-md-end">
                    <button
                      onclick="deleteMyNote(${note.note_id})"
                      class="btn-glass-outline"
                      style="padding:0.4rem 1rem;
                        border-color:#ff6b6b;
                        color:#ff6b6b;
                        font-size:0.85rem;">
                      🗑 Delete
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `).join('')

      } catch (error) {
        console.error('My uploads error:', error)
        document.getElementById('myUploadsLoading').style.display = 'none'
      }
    }

    // ─────────────────────────────────────
    // DELETE MY NOTE
    // ─────────────────────────────────────
    async function deleteMyNote(noteId) {
      if (!confirm('Are you sure you want to delete this note?')) return

      try {
        const response = await fetch(`/api/notes/${noteId}`, {
          method: 'DELETE',
          headers: authHeaders
        })

        if (response.ok) {
          loadMyUploads()
          loadStats()
        }
      } catch (error) {
        console.error('Delete error:', error)
      }
    }

    // Init
    loadStats()
    loadMyUploads()
  </script>

</body>
</html>
