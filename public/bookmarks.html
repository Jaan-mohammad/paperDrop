<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookmarks — paperDrop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar glass-nav">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">📄 paperDrop</a>
      <div class="d-flex align-items-center gap-3">
        <a href="/browse.html"
          style="color:var(--text-secondary);
          font-size:0.85rem; text-decoration:none;">
          Browse
        </a>
        <a href="/dashboard.html"
          style="color:var(--text-secondary);
          font-size:0.85rem; text-decoration:none;">
          Dashboard
        </a>
        <button class="btn-glass-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <div class="mb-4">
      <h1 class="page-title">My Bookmarks 🔖</h1>
      <p class="page-subtitle">Notes you saved for later</p>
    </div>

    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border"
        style="color:var(--accent);" role="status">
      </div>
      <p style="color:var(--text-secondary); margin-top:1rem;">
        Loading bookmarks...
      </p>
    </div>

    <div id="bookmarksList" class="row g-3"></div>

    <div id="emptyState"
      class="glass-card text-center py-5"
      style="display:none;">
      <p style="font-size:2rem;">🔖</p>
      <p style="color:var(--text-secondary); margin:0;">
        No bookmarks yet.
      </p>
      <p style="color:var(--text-muted); font-size:0.85rem; margin:0.5rem 0 1rem;">
        Browse notes and click Save to bookmark them
      </p>
      <button
        class="btn-glass"
        style="width:auto; padding:0.6rem 1.5rem;"
        onclick="window.location.href='/browse.html'">
        Browse Notes
      </button>
    </div>

  </div>

  <script>
    const token = localStorage.getItem('token')
    const user = JSON.parse(localStorage.getItem('user'))

    if (!token || !user) window.location.href = '/login.html'

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token')
      localStorage.removeItem('user')
      window.location.href = '/login.html'
    })

    async function loadBookmarks() {
      try {
        const response = await fetch('/api/bookmarks', {
          headers: { Authorization: `Bearer ${token}` }
        })
        const data = await response.json()
        const notes = data.notes

        document.getElementById('loadingState').style.display = 'none'

        if (notes.length === 0) {
          document.getElementById('emptyState').style.display = 'block'
          return
        }

        document.getElementById('bookmarksList').innerHTML =
          notes.map(note => `
            <div class="col-12 col-md-6 col-lg-4">
              <div class="note-card">
                <div class="d-flex justify-content-between
                  align-items-start mb-2">
                  <div>
                    <span class="glass-badge">${note.subject}</span>
                    <span class="glass-badge">Sem ${note.semester}</span>
                  </div>
                  <span style="font-size:0.75rem;
                    color:var(--text-muted);">
                    ${new Date(note.bookmarked_at)
                      .toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric'
                      })}
                  </span>
                </div>

                <p class="note-title">${note.title}</p>
                <p class="note-meta">By ${note.uploader_name}</p>

                ${note.description
                  ? `<p class="note-desc">${note.description}</p>`
                  : ''}

                <hr class="glass-divider">

                <div class="d-flex justify-content-between
                  align-items-center">
                  <span style="font-size:0.78rem;
                    color:var(--text-muted);">
                    📥 ${note.downloads} downloads
                  </span>
                  <div class="d-flex gap-2">
                    <button
                      onclick="removeBookmark(${note.note_id}, this)"
                      class="btn-glass-outline"
                      style="font-size:0.8rem;
                        padding:0.4rem 0.75rem;
                        border-color:#ff6b6b;
                        color:#ff6b6b;">
                      Remove
                    </button>
                    <button
                      onclick="window.open(
                        '/api/notes/${note.note_id}/download?token=${token}',
                        '_blank')"
                      class="btn-glass-outline"
                      style="font-size:0.8rem;
                        padding:0.4rem 0.9rem;">
                      Download
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `).join('')

      } catch (error) {
        console.error('Load bookmarks error:', error)
        document.getElementById('loadingState').style.display = 'none'
        document.getElementById('emptyState').style.display = 'block'
      }
    }

    async function removeBookmark(noteId, btn) {
      try {
        const response = await fetch(`/api/bookmarks/${noteId}`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        })

        if (response.ok) {
          // Remove card from UI
          btn.closest('.col-12').remove()

          // Check if list is now empty
          const remaining = document.getElementById('bookmarksList')
          if (remaining.children.length === 0) {
            document.getElementById('emptyState').style.display = 'block'
          }
        }
      } catch (error) {
        console.error('Remove bookmark error:', error)
      }
    }

    loadBookmarks()
  </script>

</body>
</html>
