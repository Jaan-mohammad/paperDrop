<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Notes — paperDrop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar glass-nav">
    <div class="container">
      <a class="navbar-brand" href="/dashboard.html">📄 paperDrop</a>
      <div class="d-flex align-items-center gap-3">
        <a href="/upload.html"
          style="color:var(--text-secondary);
          font-size:0.85rem;
          text-decoration:none;">
          Upload
        </a>
        <a href="/dashboard.html"
          style="color:var(--text-secondary);
          font-size:0.85rem;
          text-decoration:none;">
          Dashboard
        </a>
        <button class="btn-glass-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="container py-5">

    <!-- Header -->
    <div class="mb-4">
      <h1 class="page-title">Browse Notes 🔍</h1>
      <p class="page-subtitle">Find study materials shared by students</p>
    </div>

    <!-- Search + Filter Bar -->
    <div class="glass-card mb-4">
      <div class="row g-3">

        <div class="col-12 col-md-4">
          <input
            type="text"
            id="searchInput"
            class="glass-input"
            placeholder="Search by title or description...">
        </div>

        <div class="col-6 col-md-3">
          <input
            type="text"
            id="subjectFilter"
            class="glass-input"
            placeholder="Subject (e.g. OS, DBMS)">
        </div>

        <div class="col-6 col-md-2">
          <select id="semesterFilter" class="glass-input">
            <option value="">All Semesters</option>
            <option value="1">Sem 1</option>
            <option value="2">Sem 2</option>
            <option value="3">Sem 3</option>
            <option value="4">Sem 4</option>
            <option value="5">Sem 5</option>
            <option value="6">Sem 6</option>
            <option value="7">Sem 7</option>
            <option value="8">Sem 8</option>
          </select>
        </div>

        <div class="col-6 col-md-2">
          <select id="sortFilter" class="glass-input">
            <option value="latest">Latest</option>
            <option value="popular">Most Downloaded</option>
          </select>
        </div>

        <div class="col-6 col-md-1">
          <button
            id="resetBtn"
            class="btn-glass-outline w-100"
            style="height:100%;">
            Reset
          </button>
        </div>

      </div>
    </div>

    <!-- Results count -->
    <p id="resultsCount"
      style="font-size:0.85rem;
      color:var(--text-muted);
      margin-bottom:1rem;">
    </p>

    <!-- Notes Grid -->
    <div id="notesGrid" class="row g-3"></div>

    <!-- Loading State -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border"
        style="color:var(--accent);"
        role="status">
      </div>
      <p style="color:var(--text-secondary);
        margin-top:1rem;">
        Loading notes...
      </p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="text-center py-5" style="display:none;">
      <p style="font-size:3rem;">📭</p>
      <p style="color:var(--text-secondary); font-size:1rem;">
        No notes found
      </p>
      <p style="color:var(--text-muted); font-size:0.85rem;">
        Try different search terms or filters
      </p>
    </div>

  </div>

  <script src="/js/browse.js"></script>
</body>
</html>
