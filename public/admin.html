<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — paperDrop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar glass-nav">
    <div class="container">
      <a class="navbar-brand" href="/admin.html">📄 paperDrop Admin</a>
      <div class="d-flex align-items-center gap-3">
        <span style="font-size:0.8rem; color:var(--accent);">
          👑 Admin Panel
        </span>
        <button class="btn-glass-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">

    <!-- Stats Row -->
    <div class="row g-3 mb-5">
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0" style="font-size:2rem; font-weight:700;"
            id="statPending">0</p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Pending
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0" style="font-size:2rem; font-weight:700;"
            id="statTotal">0</p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Total Notes
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0" style="font-size:2rem; font-weight:700;"
            id="statUsers">0</p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Total Users
          </p>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="glass-card text-center">
          <p class="mb-0" style="font-size:2rem; font-weight:700;"
            id="statApproved">0</p>
          <p class="mb-0"
            style="font-size:0.8rem; color:var(--text-secondary);">
            Approved
          </p>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="d-flex gap-2 mb-4">
      <button class="btn-glass" id="tabPending"
        onclick="switchTab('pending')"
        style="width:auto; padding:0.5rem 1.25rem;">
        Pending Notes
      </button>
      <button class="btn-glass-outline" id="tabAll"
        onclick="switchTab('all')"
        style="padding:0.5rem 1.25rem;">
        All Notes
      </button>
      <button class="btn-glass-outline" id="tabUsers"
        onclick="switchTab('users')"
        style="padding:0.5rem 1.25rem;">
        Users
      </button>
    </div>

    <!-- Pending Notes Tab -->
    <div id="pendingTab">
      <h5 style="font-weight:600; margin-bottom:1rem;">
        Pending Approvals
      </h5>
      <div id="pendingList"></div>
      <div id="pendingEmpty" class="glass-card text-center py-5"
        style="display:none;">
        <p style="font-size:2rem;">✅</p>
        <p style="color:var(--text-secondary); margin:0;">
          No pending notes. All caught up!
        </p>
      </div>
    </div>

    <!-- All Notes Tab -->
    <div id="allTab" style="display:none;">
      <h5 style="font-weight:600; margin-bottom:1rem;">All Notes</h5>
      <div id="allNotesList"></div>
    </div>

    <!-- Users Tab -->
    <div id="usersTab" style="display:none;">
      <h5 style="font-weight:600; margin-bottom:1rem;">All Users</h5>
      <div id="usersList"></div>
    </div>

  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
